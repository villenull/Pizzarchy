# CI: TASK-T0-test-infrastructure.md §5.
#
# .github/workflows/ is the one exception to CLAUDE.md's "no
# subdirectories" rule — GitHub Actions requires this exact path, it
# isn't a project file-organization choice.
#
# Two jobs, cheapest-first (PLAN.md §9's five-tier testing strategy):
#   lint-and-unit-test  — every push/PR. shellcheck + bash -n + the rootless
#                         unit suites, discovered as test/unit/test-*.sh.
#                         Seconds. (This said "test-vm-*.sh" until a non-vm
#                         suite landed — test-deck-session.sh. The glob has
#                         always been test-*.sh; the comment was narrower than
#                         the code, which is the direction that makes a reader
#                         think a suite isn't running.)
#   iso-install-test    — tags only. Builds the ISO and runs
#                         vm-install-test.sh against it (T0 §1's tier-1
#                         harness). NOTE: GitHub-hosted runners have no
#                         /dev/kvm (confirmed absent from upstream
#                         omarchy-iso's own CI for the same reason —
#                         session 1 research), so this runs under TCG
#                         software emulation, not KVM — vm-install-test.sh
#                         detects this automatically and falls back, but
#                         it will be much slower than a KVM-accelerated
#                         local run. A self-hosted runner with KVM would
#                         remove this constraint if the timeout below
#                         proves too tight in practice.

name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools mtools btrfs-progs jq openssl qemu-utils python3-evdev

      # ⚠️ shellcheck is PINNED, and apt's is deliberately not used.
      #
      # apt installs whatever ubuntu-latest carries that week, while a developer
      # has whatever their distro ships -- so the same tree can be clean here and
      # dirty locally, or worse, clean locally and dirty here. Measured
      # 2026-08-11: this machine had 0.11.0 and flagged two SC2016 findings the
      # runner's older build may not have; a commit message claimed "CI is red"
      # on the strength of a local run, and that was never true.
      #
      # Bump this deliberately, and run the same version locally when you do:
      #   docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 -x <files>
      - name: Install pinned shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
          # Fail loudly if the binary is not the version we asked for -- a silent
          # fallback to apt's would put this check straight back where it was.
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}" ||
            { echo "shellcheck is not ${SHELLCHECK_VERSION}"; exit 1; }

      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          [[ ${#files[@]} -gt 0 ]] || { echo "no *.sh files found"; exit 1; }
          echo "checking ${#files[@]} scripts"
          # -x follows sourced libraries; .shellcheckrc sets source-path=SCRIPTDIR
          shellcheck -x "${files[@]}"

      - name: python syntax check
        run: |
          mapfile -t files < <(git ls-files '*.py')
          [[ ${#files[@]} -gt 0 ]] || { echo "no *.py files found"; exit 1; }
          for f in "${files[@]}"; do
            echo "checking $f"
            python3 -m py_compile "$f"
          done

      - name: bash -n syntax check
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          for f in "${files[@]}"; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Python unit tests
        run: |
          shopt -s nullglob
          pytests=(test/unit/test-*.py)
          [[ ${#pytests[@]} -gt 0 ]] || { echo "no python unit suites found"; exit 1; }
          status=0
          for t in "${pytests[@]}"; do
            echo "=== $t ==="
            python3 "$t" || status=1
          done
          exit $status

      - name: Unit tests
        run: |
          shopt -s nullglob
          tests=(test/unit/test-*.sh)
          [[ ${#tests[@]} -gt 0 ]] || { echo "no unit test suites found"; exit 1; }
          status=0
          for f in "${tests[@]}"; do
            echo "::group::$f"
            ./"$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  # T5 (ISO build) hasn't landed yet — this job's ISO-build step is a
  # placeholder until it does. Gated on a tag push so it doesn't block
  # ordinary PRs on infrastructure that doesn't exist yet.
  iso-install-test:
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint-and-unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report KVM availability
        run: |
          if [[ -e /dev/kvm ]]; then
            echo "/dev/kvm present"
          else
            echo "/dev/kvm absent — vm-install-test.sh will fall back to TCG (slow, expected on GitHub-hosted runners)"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf parted dosfstools mtools btrfs-progs jq openssl socat

      - name: Build ISO
        run: |
          echo "TODO(T5): no ISO build entry point exists in this repo yet." >&2
          echo "Once omarchy-deck-iso (or this repo's own build step) lands," >&2
          echo "invoke it here to produce the .iso this job tests." >&2
          exit 1

      - name: Run install test
        run: |
          shopt -s nullglob
          isos=(*.iso)
          [[ ${#isos[@]} -eq 1 ]] || { echo "expected exactly one built .iso, found ${#isos[@]}"; exit 1; }
          VM_INSTALL_TIMEOUT_SEC=3600 ./test/vm/vm-install-test.sh "${isos[0]}"

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-deck-iso
          path: "*.iso"
          if-no-files-found: ignore
